name: Publish Docker images

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  IMAGE_NAME: tusharsahni22/auto-trader

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create push timestamp
        id: timestamp
        shell: bash
        run: echo "value=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:backend-${{ steps.timestamp.outputs.value }}
            ${{ env.IMAGE_NAME }}:backend-latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:frontend-${{ steps.timestamp.outputs.value }}
            ${{ env.IMAGE_NAME }}:frontend-latest