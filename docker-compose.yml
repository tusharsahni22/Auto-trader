# Pull-based deploy. Images come from Docker Hub; everything configurable lives in
# a .env file sitting next to this one.
#
#   docker compose pull && docker compose up -d
#
# `env_file` passes that .env straight into the container, so ADDING A NEW SETTING
# NEVER NEEDS THIS FILE EDITED — put the key in .env and restart. Only the three
# values below are set here, because they describe the container rather than the
# strategy, and every other setting has a working default in code. Start from
# .env.deploy.example; anything you leave out simply uses its default.
services:
  backend:
    image: ${DOCKERHUB_IMAGE:-tusharsahni22/auto-trader}:${BACKEND_TAG:-backend-latest}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    # Short form on purpose: the `path:`/`required:` long form needs Compose 2.24+,
    # and this has to parse on whatever version the server happens to run. A missing
    # .env fails the deploy loudly, which beats silently booting on defaults.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      # Must match the named volume below, not the host layout.
      DATA_DIR: /app/data
    volumes:
      - trader_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_IMAGE:-tusharsahni22/auto-trader}:${FRONTEND_TAG:-frontend-latest}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      NODE_ENV: production
      # Container-to-container, so this is the service name rather than a host port.
      VITE_API_PROXY: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  trader_data:
