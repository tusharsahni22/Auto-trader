services:
  backend:
    build: ./backend
    image: tusharsahni22/auto-trader:backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      STARTING_EQUITY: ${STARTING_EQUITY:-10000}
      DATA_DIR: /data
      # Optional paid/free API keys for future data sources (see docs/06-data-and-features.md)
      COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
      CRYPTOCOMPARE_API_KEY: ${CRYPTOCOMPARE_API_KEY:-}
    volumes:
      - trader_data:/data
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: tusharsahni22/auto-trader:frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_PROXY: http://backend:4000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  trader_data:
  backend_node_modules:
  frontend_node_modules:
